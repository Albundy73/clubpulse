name: Ingest TheSportsDB

on:
  push:
    branches:
      - feature/competition-first-structure
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger ClubPulse ingestion
        env:
          DEFAULT_INGEST_URL: ${{ secrets.CLUBPULSE_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            INGEST_URL="https://clubpulse-git-feature-competition-first-structure-apcd.vercel.app/api/ingest/thesportsdb"
          else
            INGEST_URL="$DEFAULT_INGEST_URL"
          fi

          if [ -z "${INGEST_URL:-}" ]; then
            echo "Missing ingestion URL"
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing GitHub secret: INGEST_SECRET"
            exit 1
          fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "Missing GitHub secret: VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

          response_file=$(mktemp)
          for attempt in $(seq 1 18); do
            http_code=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --header "Authorization: Bearer $INGEST_SECRET" \
              "$INGEST_URL" || true)

            cat "$response_file"
            echo

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              exit 0
            fi

            echo "Attempt $attempt returned HTTP $http_code; waiting for Preview/dependency readiness..."
            sleep 10
          done

          echo "Ingestion did not succeed after retries"
          exit 1
