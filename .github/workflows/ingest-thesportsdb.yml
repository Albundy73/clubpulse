name: Ingest TheSportsDB

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger ClubPulse ingestion
        env:
          INGEST_URL: ${{ secrets.CLUBPULSE_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${INGEST_URL:-}" ]; then
            echo "Missing GitHub secret: CLUBPULSE_INGEST_URL"
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing GitHub secret: INGEST_SECRET"
            exit 1
          fi

          response_file=$(mktemp)
          http_code=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $INGEST_SECRET" \
            "$INGEST_URL")

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Ingestion failed with HTTP $http_code"
            exit 1
          fi
